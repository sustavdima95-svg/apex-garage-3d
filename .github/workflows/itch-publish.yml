name: Publish to itch.io
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/itch-publish.yml
  workflow_dispatch:
    inputs:
      include_history:
        description: 'Import all GitHub releases from oldest to newest (first run)'
        type: boolean
        default: true
  workflow_run:
    workflows: ["Build desktop apps"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
concurrency:
  group: itch-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: windows-x64
            asset: ApexGarage3D-win-x64.zip
          - channel: linux-x64
            asset: ApexGarage3D-Linux-x64.zip
          - channel: mac-arm64
            asset: ApexGarage3D-mac-arm64.zip
          - channel: mac-x64
            asset: ApexGarage3D-mac-x64.zip
    steps:
      - name: Check publishing authorization
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::Add repository Actions secret BUTLER_API_KEY before publishing."
            exit 1
          fi
      - name: Install official itch.io Butler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/butler"
          curl --fail --silent --show-error --location --retry 3 "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default" -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" version
      - name: Transfer releases from GitHub to itch.io
        env:
          GH_TOKEN: ${{ github.token }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          IMPORT_HISTORY: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.include_history) }}
          ASSET_NAME: ${{ matrix.asset }}
          CHANNEL: ${{ matrix.channel }}
          ITCH_TARGET: the-apex-garage/apex-garage-3d
        shell: bash
        run: |
          set -euo pipefail
          tags_file="$RUNNER_TEMP/tags.txt"
          if [ "$IMPORT_HISTORY" = "true" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V > "$tags_file"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' > "$tags_file"
          fi
          test -s "$tags_file"
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            archive_dir="$(mktemp -d "$RUNNER_TEMP/apex.XXXXXX")"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir "$archive_dir"
            test -s "$archive_dir/$ASSET_NAME"
            "$RUNNER_TEMP/butler/butler" push "$archive_dir/$ASSET_NAME" "$ITCH_TARGET:$CHANNEL" --userversion "${tag#v}"
            rm -rf "$archive_dir"
          done < "$tags_file"
