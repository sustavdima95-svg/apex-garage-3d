name: Build desktop apps
on:
  push:
    branches: [main]
    paths:
      - index.html
      - main.cjs
      - package.json
      - scripts/desktop-page.cjs
      - .github/workflows/desktop.yml
  workflow_dispatch:
concurrency:
  group: desktop-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node scripts/desktop-page.cjs
      - run: npx electron-builder --${{ matrix.platform }} ${{ matrix.platform == 'linux' && 'AppImage' || 'zip' }} --${{ matrix.arch }} --publish never
      - if: matrix.platform == 'linux'
        run: cd release && zip -j ApexGarage3D-Linux-x64.zip *.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: apex-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*.zip
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apex-*
          path: collected
          merge-multiple: true
      - name: Publish downloadable archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Apex Garage 3D 1.7.2 — Beta 14 Ultimate Edition · Racing"
          if gh release view v1.7.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.7.2 collected/*.zip --clobber --repo "$GITHUB_REPOSITORY"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.7.2" -f sha="$GITHUB_SHA" -F force=true
            gh release edit v1.7.2 --latest --title "$title" --notes "Three redesigned courses: Countryside two-lap circuit with a bridge and hairpins, Sunset City street circuit with an overpass, Mountain Pass switchback sprint. Route minimap, sequential directional checkpoints, three AI opponents and difficulty levels, credits and XP. Dedicated SOLARIS high-grip tyres." --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.7.2 collected/*.zip --target "$GITHUB_SHA" --latest --title "$title" --notes "Three redesigned courses: Countryside two-lap circuit with a bridge and hairpins, Sunset City street circuit with an overpass, Mountain Pass switchback sprint. Route minimap, sequential directional checkpoints, three AI opponents and difficulty levels, credits and XP. Dedicated SOLARIS high-grip tyres." --repo "$GITHUB_REPOSITORY"
          fi
