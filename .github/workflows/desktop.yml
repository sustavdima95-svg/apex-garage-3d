name: Build desktop apps
on:
  push:
    branches: [main]
    paths:
      - index.html
      - main.cjs
      - package.json
      - scripts/desktop-page.cjs
      - scripts/bundle-ai.py
      - AI/**
      - .github/workflows/desktop.yml
  workflow_dispatch:
concurrency:
  group: desktop-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node scripts/desktop-page.cjs
      - run: npx electron-builder --${{ matrix.platform }} ${{ matrix.platform == 'linux' && 'AppImage' || 'zip' }} --${{ matrix.arch }} --publish never
      - if: matrix.platform == 'linux'
        run: cd release && zip -j ApexGarage3D-Linux-x64.zip *.AppImage
      - run: python scripts/bundle-ai.py
      - uses: actions/upload-artifact@v4
        with:
          name: apex-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*.zip
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apex-*
          path: collected
          merge-multiple: true
      - name: Publish downloadable archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Apex Garage 3D 1.8.1 — Local AI and driving fixes"
          notes="Includes the local AI menu, launch scripts and setup guide for Ollama qwen3:14b, Grid bridge ascent and jumps, crash recovery, reverse driving, and more physical landing damage. Install Ollama separately; the model downloads on first AI launch."
          if gh release view v1.8.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.8.1 collected/*.zip --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v1.8.1 --latest --title "$title" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.8.1 collected/*.zip --target "$GITHUB_SHA" --latest --title "$title" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          fi
