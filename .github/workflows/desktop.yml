name: Build desktop apps
on:
  push:
    branches: [main]
    paths:
      - index.html
      - main.cjs
      - package.json
      - scripts/desktop-page.cjs
      - .github/workflows/desktop.yml
  workflow_dispatch:
concurrency:
  group: desktop-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node scripts/desktop-page.cjs
      - run: npx electron-builder --${{ matrix.platform }} ${{ matrix.platform == 'linux' && 'AppImage' || 'zip' }} --${{ matrix.arch }} --publish never
      - if: matrix.platform == 'linux'
        run: cd release && zip -j ApexGarage3D-Linux-x64.zip *.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: apex-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*.zip
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apex-*
          path: collected
          merge-multiple: true
      - name: Publish downloadable archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Apex Garage 3D 1.7.1 — Beta 14 Ultimate Edition · Credits"
          old_name=$(gh release view v1.7.1 --json name --jq .name --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.7.1" --jq .object.sha 2>/dev/null || true)
          if [ "$old_name" = "Apex Garage 3D 1.7.1 — Beta 14 Ultimate Edition" ] || { [ "$old_name" = "$title" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; }; then
            gh release delete v1.7.1 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
            old_name=""
          elif [ -n "$old_name" ] && [ "$old_name" != "$title" ]; then
            echo "Unexpected release title, refusing to replace it"; exit 1
          fi
          if [ "$old_name" = "$title" ]; then
            gh release upload v1.7.1 collected/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.7.1 collected/*.zip --target "$GITHUB_SHA" --latest --title "$title" --notes "1,000 starting credits, prices on every part and tuning service, persistent purchases and separate free sandbox tuning. Original detailed vehicles and six maps retained." --repo "$GITHUB_REPOSITORY"
          fi
          for tag in v1.7.0 v1.7.2; do
            name=$(gh release view "$tag" --json name --jq .name --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)
            if [ "$name" = "Apex Garage 3D ${tag#v} — Beta 14 Ultimate Edition" ]; then
              gh release delete "$tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
            elif [ -n "$name" ]; then
              echo "Unexpected release title for $tag; not deleting"; exit 1
            fi
          done
          gh release edit v1.7.1 --latest --repo "$GITHUB_REPOSITORY"
