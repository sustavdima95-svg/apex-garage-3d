name: Build desktop apps
on:
  push:
    branches: [main]
    paths:
      - index.html
      - main.cjs
      - package.json
      - scripts/desktop-page.cjs
      - .github/workflows/desktop.yml
  workflow_dispatch:
concurrency:
  group: desktop-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node scripts/desktop-page.cjs
      - run: npx electron-builder --${{ matrix.platform }} ${{ matrix.platform == 'linux' && 'AppImage' || 'zip' }} --${{ matrix.arch }} --publish never
      - if: matrix.platform == 'linux'
        run: cd release && zip -j ApexGarage3D-Linux-x64.zip *.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: apex-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*.zip
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apex-*
          path: collected
          merge-multiple: true
      - name: Publish downloadable archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Apex Garage 3D 1.8 — Beta 14 Ultimate Edition · PHANTOM ULTRA"
          if gh release view v1.8.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.8.0 collected/*.zip --clobber --repo "$GITHUB_REPOSITORY"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.8.0" -f sha="$GITHUB_SHA" -F force=true
            gh release edit v1.8.0 --latest --title "$title" --notes "Добавлены секретные коды для машин, двигателей и окраски. PHANTOM X-3000: 30 000 л.с., до 3000 км/ч, встроенное автоматическое ULTRA N₂O ×3 на 30 секунд. Полигон расширен до 10 × 10 км. Улучшены графика кузова, смятие металла, отскок и вращение при столкновениях, падение обломков, стирание краски и цветные следы на дороге." --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.8.0 collected/*.zip --target "$GITHUB_SHA" --latest --title "$title" --notes "Добавлены секретные коды для машин, двигателей и окраски. PHANTOM X-3000: 30 000 л.с., до 3000 км/ч, встроенное автоматическое ULTRA N₂O ×3 на 30 секунд. Полигон расширен до 10 × 10 км. Улучшены графика кузова, смятие металла, отскок и вращение при столкновениях, падение обломков, стирание краски и цветные следы на дороге." --repo "$GITHUB_REPOSITORY"
          fi
